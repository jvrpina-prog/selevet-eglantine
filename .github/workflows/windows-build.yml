name: Windows build (Intel Arc)

on:
  push:
    branches: [ main, 'arc/**' ]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tools (Ninja, Vulkan SDK)
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          $sdk = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile $sdk
          Start-Process -Wait -FilePath $sdk -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install"
          "C:\VulkanSDK\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\Program Files\Git\usr\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', '**/cpmfile.json') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          "-DCMAKE_C_FLAGS=/arch:AVX2"
          "-DCMAKE_CXX_FLAGS=/arch:AVX2 /EHsc"
          -DYUZU_TESTS=OFF -DBUILD_TESTING=OFF
          -DYUZU_CMD=OFF -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF
          -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel 4
          sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $out = "selevet-arc"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item build\bin\* $out -Recurse
          Copy-Item dist\nx2_switches.txt $out\
          if (Test-Path "dist\nx2_switches - Intel Arc.txt") { Copy-Item "dist\nx2_switches - Intel Arc.txt" $out\ }
          Get-ChildItem $out -Recurse -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item -Force

      - uses: actions/upload-artifact@v4
        with:
          name: selevet-arc-${{ github.sha }}
          path: selevet-arc
          retention-days: 14
