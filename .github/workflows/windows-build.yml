name: Windows build (Intel Arc)

on:
  push:
    branches: [ main, 'arc/**' ]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tools (Ninja, Vulkan SDK)
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          choco upgrade llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $sdk = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile $sdk
          Start-Process -Wait -FilePath $sdk -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install"
          "C:\VulkanSDK\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\Program Files\Git\usr\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', '**/cpmfile.json') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure (clang-cl, ThinLTO, PGO, Skylake-class AVX2)
        shell: pwsh
        run: |
          clang-cl --version
          $prof = "${{ github.workspace }}/tuned/eglantine.profdata" -replace '\\','/'
          $pgo = ""
          llvm-profdata show "$prof" > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            $pgo = "/clang:-fprofile-use=$prof /clang:-Wno-profile-instr-unprofiled /clang:-Wno-profile-instr-out-of-date /clang:-Wno-backend-plugin"
            Write-Host "PGO profile in use"
          } else { Write-Host "PGO profile unreadable by this LLVM: building without PGO" }
          $flags = "/clang:-march=x86-64-v3 /clang:-mtune=skylake -flto=thin $pgo"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link -DCMAKE_AR=llvm-lib `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            "-DCMAKE_C_FLAGS=/DWIN32 /D_WINDOWS $flags" `
            "-DCMAKE_CXX_FLAGS=/DWIN32 /D_WINDOWS /EHsc $flags" `
            "-DCMAKE_EXE_LINKER_FLAGS=/machine:x64 /opt:lldltojobs=4" `
            -DENABLE_LTO=ON `
            -DYUZU_TESTS=OFF -DBUILD_TESTING=OFF `
            -DYUZU_CMD=OFF -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF `
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel 4
          sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $out = "selevet-arc"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item build\bin\* $out -Recurse
          Copy-Item dist\nx2_switches.txt $out\
          if (Test-Path "dist\nx2_switches - Intel Arc.txt") { Copy-Item "dist\nx2_switches - Intel Arc.txt" $out\ }
          Get-ChildItem $out -Recurse -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item -Force

      - uses: actions/upload-artifact@v4
        with:
          name: selevet-arc-${{ github.sha }}
          path: selevet-arc
          retention-days: 14
